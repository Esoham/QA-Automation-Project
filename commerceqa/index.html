<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommerceQA | Industrial Parts Demo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172338;background:#f4f6f8}
main{max-width:960px;margin:2rem auto;padding:1.4rem}h1{font-size:2.1rem}
form{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;padding:1rem;background:#fff;border:1px solid #cbd5e1;border-radius:8px}
label{display:block;font-weight:650;margin-bottom:.35rem}input,select,button{font:inherit;padding:.65rem;border-radius:5px;border:1px solid #64748b}
button{background:#173f69;color:white;border-color:#173f69;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:1rem;margin-top:1rem}
article{background:white;border:1px solid #cbd5e1;border-radius:8px;padding:1rem}article h3{margin-top:.2rem}
#status,#quote-status{min-height:1.5rem;margin-top:1rem}small{color:#475569}
</style>
</head>
<body><main>
<h1>CommerceQA Industrial Parts</h1>
<p>Fictional product data for a software-testing portfolio. Not a real store.</p>
<form id="search-form" role="search">
 <div><label for="search">Search products</label><input id="search" name="search" placeholder="SKU, name, specification"></div>
 <div><label for="category">Category</label><select id="category" name="category"><option value="">All categories</option><option>Fasteners</option><option>Hardware</option><option>Safety</option><option>Electrical</option></select></div>
 <button type="submit">Search products</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="results" aria-label="Product results"></section>
<p id="quote-status" role="status" aria-live="polite"></p>
<script>
const searchForm=document.getElementById('search-form');
const results=document.getElementById('results');
const status=document.getElementById('status');
const quoteStatus=document.getElementById('quote-status');
async function loadProducts(){
 const values=new FormData(searchForm);const params=new URLSearchParams(values);
 status.textContent='Loading products'; results.replaceChildren();quoteStatus.textContent='';
 try{
  const response=await fetch('/api/products?'+params.toString());
  if(!response.ok)throw new Error('Catalog request failed');
  const payload=await response.json();status.textContent=`${payload.count} products found`;
  if(!payload.count){results.textContent='No products match your search.';return;}
  payload.items.forEach(item=>{
   const card=document.createElement('article');
   const title=document.createElement('h3');title.textContent=item.name;
   const sku=document.createElement('p');sku.textContent=`SKU: ${item.sku}`;
   const spec=document.createElement('p');spec.textContent=item.specification;
   const price=document.createElement('p');price.textContent=`$${item.unit_price} · ${item.stock} in stock`;
   const action=document.createElement('button');action.textContent=`Quote ${item.sku}`;
   action.addEventListener('click',()=>requestQuote(item.sku));
   card.append(title,sku,spec,price,action);results.append(card);
  });
 }catch(error){status.textContent='Unable to load products. Try again.'}
}
async function requestQuote(sku){
 try{
  const response=await fetch('/api/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lines:[{sku,quantity:1}]})});
  const data=await response.json();
  quoteStatus.textContent=response.ok?`Quote for ${sku}: $${data.subtotal}`:`Quote unavailable: ${data.detail}`;
 }catch(error){quoteStatus.textContent='Quote service unavailable.'}
}
searchForm.addEventListener('submit',event=>{event.preventDefault();loadProducts()});
loadProducts();
</script>
</main></body></html>
