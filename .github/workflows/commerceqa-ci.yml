name: CommerceQA - Playwright, Selenium, API, AI evals
on:
  push:
    paths:
      - 'commerceqa/**'
      - 'tests/**'
      - 'evals/**'
      - 'pytest.ini'
      - 'requirements-dev.txt'
      - '.github/workflows/commerceqa-ci.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run API, browser, eval-grader tests
        run: python -m pytest -m "not selenium" -q --junitxml=results/junit.xml
        env:
          QA_ARTIFACTS: results/traces
      - name: Run synthetic model-response evals
        run: python -m evals.grade --report results/ai-eval-report.json
      - name: Upload reproducible test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerceqa-test-evidence
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  selenium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y chromium chromium-driver
      - name: Run Selenium Chrome smoke tests
        run: python -m pytest -m selenium -q --junitxml=results/selenium-junit.xml
        env:
          SELENIUM_CHROME_BINARY: /usr/bin/chromium
          SELENIUM_DRIVER_PATH: /usr/bin/chromedriver
      - name: Upload Selenium test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-evidence
          path: results/selenium-junit.xml
          retention-days: 7
