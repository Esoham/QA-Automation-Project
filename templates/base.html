<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmFresh Tester | {{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <div class="site-head"><span class="site-mark" aria-hidden="true">✳</span><strong>FarmFresh Tester</strong><span class="site-sub">QA portfolio demo</span></div>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('product_list') }}">Products</a>
      <a href="{{ url_for('about') }}">About</a>
    </nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer>Fictional product catalog for testing practice. No real purchases or payment processing.</footer>
</body>
</html>
