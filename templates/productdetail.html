{% extends "base.html" %}
{% block content %}
<article class="panel product-detail">
  <div class="eyebrow">Product details</div>
  <h1>{{ product.name }}</h1>
  <p>{{ product.description }}</p>
  <dl class="details">
    <div><dt>Price</dt><dd>${{ "%.2f"|format(product.price) }}</dd></div>
    <div><dt>Origin</dt><dd>{{ product.origin }}</dd></div>
    <div><dt>Category</dt><dd>{{ product.category }}</dd></div>
  </dl>
  <p><a href="{{ url_for('product_list') }}">Back to products</a></p>
</article>
{% endblock %}
