{% extends "base.html" %}
{% block content %}
<div class="eyebrow">Product catalog</div>
<h1>Our Products</h1>
<p>Search the demo products and add selections to a local, non-persistent cart.</p>
<section class="panel">
  <form id="filter-form" role="search">
    <div class="filters">
      <div><label for="search">Search products</label><input id="search" name="search" type="search" maxlength="100" autocomplete="off" placeholder="Try apples or eggs"></div>
      <div><label for="category">Product category</label>
        <select id="category" name="category">
          <option value="">All categories</option>
          {% for category in categories %}
          <option value="{{ category }}">{{ category }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit">Apply filters</button>
    </div>
  </form>
  <p id="results-status" role="status" aria-live="polite">Loading products...</p>
  <p id="error-status" role="alert" hidden></p>
  <div id="product-list" class="product-list" aria-label="Catalog results"></div>
</section>
<aside class="panel" aria-label="Demo cart summary">
  <h2>Your demo cart</h2>
  <p id="cart-status" role="status" aria-live="polite">Cart: 0 items — $0.00</p>
  <button id="clear-cart" type="button">Clear cart</button>
  <p class="note">This example cart does not save orders or process payments.</p>
</aside>
<script src="{{ url_for('static', filename='catalog.js') }}" defer></script>
{% endblock %}
